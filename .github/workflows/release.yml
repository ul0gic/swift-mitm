name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          Scripts/validate-release-tag.sh "$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&event=push&status=success" --jq '.workflow_runs | length')"
          test "$successful_runs" -gt 0
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  distribution:
    name: Validate tagged distribution
    needs: validate
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Validate release build and documentation
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        run: Scripts/verify.sh distribution

  release:
    name: Create GitHub release
    needs: [validate, distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "SwiftMITM $RELEASE_TAG" --notes-file RELEASE_NOTES.md
