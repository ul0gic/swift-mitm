name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(head -n 1 RELEASE_NOTES.md)" == "# SwiftMITM $RELEASE_TAG" ]]
          grep -Fq "## $RELEASE_TAG - " CHANGELOG.md
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          for workflow in ci.yml codeql.yml; do
            successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$commit&branch=main&event=push&status=success" --jq '.workflow_runs | length')"
            test "$successful_runs" -gt 0
          done
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  distribution:
    name: Validate tagged distribution
    needs: validate
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Validate release build and documentation
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.tag }}
        run: |
          swift build -c release
          swift package dump-symbol-graph --minimum-access-level public
          symbol_graph_directory="$(find .build -type d -name symbolgraph -print -quit)"
          test -n "$symbol_graph_directory"
          documentation_output="$(mktemp -d "${TMPDIR:-/tmp}/swiftmitm-docc.XXXXXX")"
          trap 'rm -rf -- "$documentation_output"' EXIT
          xcrun docc convert Sources/SwiftMITM.docc \
            --additional-symbol-graph-dir "$symbol_graph_directory" \
            --output-path "$documentation_output/SwiftMITM.doccarchive" \
            --fallback-display-name SwiftMITM \
            --fallback-bundle-identifier com.ul0gic.SwiftMITM \
            --fallback-bundle-version "$RELEASE_VERSION" \
            --warnings-as-errors

  release:
    name: Create GitHub release
    needs: [validate, distribution]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: gh release create "$RELEASE_TAG" --verify-tag --title "SwiftMITM $RELEASE_TAG" --notes-file RELEASE_NOTES.md
