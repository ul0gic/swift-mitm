name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
      ci-run: ${{ steps.candidate.outputs.ci-run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(head -n 1 RELEASE_NOTES.md)" == "# SwiftMITM $RELEASE_TAG" ]]
          grep -Fq "## $RELEASE_TAG - " CHANGELOG.md
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          ci_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')"
          test -n "$ci_run"
          for workflow in codeql.yml dependency-review.yml; do
            successful_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$commit&status=success" --jq '.workflow_runs | length')"
            test "$successful_runs" -gt 0
          done
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "ci-run=$ci_run" >> "$GITHUB_OUTPUT"

  distribution:
    name: Validate tagged distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the candidate documentation archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swiftmitm-docc-${{ needs.validate.outputs.sha }}
          run-id: ${{ needs.validate.outputs.ci-run }}
          github-token: ${{ github.token }}
          path: distribution
      - name: Validate candidate archive identity
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          test "$(cat distribution/candidate-sha.txt)" = "$CANDIDATE_SHA"
          test "$(cat distribution/version.txt)" = "$RELEASE_TAG"
          test -s "distribution/SwiftMITM-$RELEASE_TAG.doccarchive.zip"
          sha256sum -c distribution/SHA256SUMS

  release:
    name: Create GitHub release
    needs: [validate, distribution]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Download the validated candidate archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: swiftmitm-docc-${{ needs.validate.outputs.sha }}
          run-id: ${{ needs.validate.outputs.ci-run }}
          github-token: ${{ github.token }}
          path: distribution
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          sha256sum -c distribution/SHA256SUMS
          gh release create "$RELEASE_TAG" "distribution/SwiftMITM-$RELEASE_TAG.doccarchive.zip" \
            --verify-tag --title "SwiftMITM $RELEASE_TAG" --notes-file RELEASE_NOTES.md
