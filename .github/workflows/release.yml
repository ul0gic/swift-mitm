name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true
        type: string
      allow_swift_codeql_unavailable:
        description: Apply the approved unsupported-toolchain exception for 0.2.2
        required: false
        default: false
        type: boolean
      swift_codeql_job_id:
        description: Reviewed failed Swift job for the exact 0.2.2 commit
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.candidate.outputs.tag }}
      sha: ${{ steps.candidate.outputs.sha }}
      ci-run: ${{ steps.candidate.outputs.ci-run }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref_name }}
      - name: Validate release candidate
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          ALLOW_SWIFT_CODEQL_UNAVAILABLE: ${{ inputs.allow_swift_codeql_unavailable || false }}
          SWIFT_CODEQL_JOB_ID: ${{ inputs.swift_codeql_job_id }}
        run: |
          [[ "$RELEASE_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$(head -n 1 RELEASE_NOTES.md)" == "# SwiftMITM $RELEASE_TAG" ]]
          grep -Fq "## $RELEASE_TAG - " CHANGELOG.md
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$commit" origin/main
          ci_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$commit&status=success" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")][0].id // empty')"
          test -n "$ci_run"
          dependency_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dependency-review.yml/runs?head_sha=$commit&status=success" --jq '.workflow_runs | length')"
          test "$dependency_runs" -gt 0
          if [[ "$ALLOW_SWIFT_CODEQL_UNAVAILABLE" == true ]]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$RELEASE_TAG" = 0.2.2
            [[ "$SWIFT_CODEQL_JOB_ID" =~ ^[0-9]+$ ]]
            export RELEASE_COMMIT="$commit"
            python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          repository = os.environ['GITHUB_REPOSITORY']
          commit = os.environ['RELEASE_COMMIT']
          job_id = os.environ['SWIFT_CODEQL_JOB_ID']

          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repository}/{path}']))

          job = api(f'actions/jobs/{job_id}')
          run = api(f"actions/runs/{job['run_id']}")
          assert job['name'] == 'CodeQL (swift)' and job['conclusion'] == 'failure'
          assert job['status'] == 'completed' and job['head_sha'] == commit
          assert run['repository']['full_name'] == repository and run['head_sha'] == commit
          assert run['path'] == '.github/workflows/codeql.yml'
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          assert run['event'] in ('push', 'workflow_dispatch')
          steps = job['steps']
          assert [step['name'] for step in steps if step['conclusion'] == 'failure'] == ['Build Swift package']
          assert all(step['conclusion'] in ('success', 'failure', 'skipped') for step in steps)
          analysis = [step for step in steps if step['name'].startswith('Run github/codeql-action/analyze@')]
          assert len(analysis) == 1 and analysis[0]['conclusion'] == 'skipped'
          rejection = [step for step in steps if step['name'] == 'Reject security findings']
          assert len(rejection) == 1 and rejection[0]['conclusion'] == 'skipped'
          jobs = api(f"actions/runs/{run['id']}/jobs?per_page=100")
          assert jobs['total_count'] == 2 and len(jobs['jobs']) == 2
          assert {item['name'] for item in jobs['jobs']} == {'CodeQL (swift)', 'CodeQL (actions)'}
          assert any(item['id'] == job['id'] for item in jobs['jobs'])
          actions = next(item for item in jobs['jobs'] if item['name'] == 'CodeQL (actions)')
          assert actions['conclusion'] == 'success' and actions['head_sha'] == commit
          log = subprocess.check_output([
              'gh', 'api', '--allow-escape-sequences', f'repos/{repository}/actions/jobs/{job_id}/logs'
          ])
          assert b'posix_spawn error: Bad CPU type in executable (86)' in log
          assert b'"/usr/bin/sandbox-exec"' in log
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
              summary.write(
                  f'Approved 0.2.2 exception: Swift CodeQL was unavailable for `{commit}`. '
                  f'[Failed Swift job]({job["html_url"]}); Actions analysis passed. '
                  'No Swift analysis result is claimed. All other release checks remain required.\n'
              )
          PY
          else
            codeql_runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs?head_sha=$commit&status=success" --jq '.workflow_runs | length')"
            test "$codeql_runs" -gt 0
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$commit" >> "$GITHUB_OUTPUT"
          echo "ci-run=$ci_run" >> "$GITHUB_OUTPUT"

  distribution:
    name: Validate tagged distribution
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the candidate documentation archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: swiftmitm-docc-${{ needs.validate.outputs.sha }}
          run-id: ${{ needs.validate.outputs.ci-run }}
          github-token: ${{ github.token }}
          path: distribution
      - name: Validate candidate archive identity
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          CANDIDATE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          test "$(cat distribution/candidate-sha.txt)" = "$CANDIDATE_SHA"
          test "$(cat distribution/version.txt)" = "$RELEASE_TAG"
          test -s "distribution/SwiftMITM-$RELEASE_TAG.doccarchive.zip"
          sha256sum -c distribution/SHA256SUMS

  release:
    name: Create GitHub release
    needs: [validate, distribution]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.validate.outputs.tag }}
      - name: Download the validated candidate archive
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: swiftmitm-docc-${{ needs.validate.outputs.sha }}
          run-id: ${{ needs.validate.outputs.ci-run }}
          github-token: ${{ github.token }}
          path: distribution
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          sha256sum -c distribution/SHA256SUMS
          gh release create "$RELEASE_TAG" "distribution/SwiftMITM-$RELEASE_TAG.doccarchive.zip" \
            --verify-tag --title "SwiftMITM $RELEASE_TAG" --notes-file RELEASE_NOTES.md
