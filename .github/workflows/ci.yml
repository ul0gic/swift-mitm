name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          docs_only=false
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            git diff --name-only --no-renames -z "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-paths"
            docs_only=true
            while IFS= read -r -d '' path; do
              [[ "$path" == *.md ]] || docs_only=false
            done < "$RUNNER_TEMP/changed-paths"
            git diff --check "$BASE_SHA" HEAD
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: scope
    if: always()
    runs-on: ${{ needs.scope.outputs.docs_only == 'true' && 'ubuntu-24.04' || 'macos-26' }}
    timeout-minutes: 45
    steps:
      - name: Require successful scope assessment
        if: needs.scope.result != 'success'
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation-only change
        if: needs.scope.outputs.docs_only == 'true'
        run: echo 'Documentation-only change; no Swift build needed.'
      - name: Run tests
        if: needs.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          isolated='SwiftMITMTests\.(Phase4PublicTransparentTLSTests|Phase6OpaqueResourceTests|Phase6TransparentResourceTests|ProductionProxyBackpressureTests|ProxyDiagnosticTests|PublicProxyHTTP2WebSocketBackpressureTests|PublicProxyHTTP2WebSocketTests|StreamingBackpressureTests)'
          swift test --force-resolved-versions --parallel --skip "$isolated"
          swift test --skip-build --filter "$isolated"
