name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  tests:
    name: Tests (${{ matrix.partition }}, ${{ matrix.os }})
    needs: consumer
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [behavior, compatibility, resources, browser]
        os: [xcode-27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Record candidate and toolchain
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/candidate-sha.txt
          sw_vers > evidence/os.txt
          swift --version > evidence/swift.txt
          xcodebuild -version > evidence/xcode.txt
          grep -Fx 'Xcode 27.1' evidence/xcode.txt
          grep -Fx 'Build version 27A9275' evidence/xcode.txt
          grep -Eq 'Swift version 6\.4([ .]|$)' evidence/swift.txt
      - name: Set up independent peer Python
        if: matrix.partition == 'compatibility' || matrix.partition == 'browser'
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install pinned independent clients
        if: matrix.partition == 'compatibility' || matrix.partition == 'browser'
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
          PARTITION: ${{ matrix.partition }}
        run: |
          client_python="$PEER_PYTHON"
          "$client_python" --version | grep -E '^Python 3\.14\.'
          "$client_python" -m venv "$RUNNER_TEMP/clients"
          packages=(cryptography==50.0.2 typing-extensions==4.16.0 cffi==2.1.1 pycparser==3.12)
          if [[ "$PARTITION" == browser ]]; then
            packages+=(playwright==1.64.1 pyee==14.0.0 greenlet==3.5.6)
          else
            packages+=(grpcio==1.85.0)
          fi
          "$RUNNER_TEMP/clients/bin/python" -m pip install --only-binary=:all: "${packages[@]}"
          "$RUNNER_TEMP/clients/bin/python" --version > evidence/python.txt
          "$RUNNER_TEMP/clients/bin/python" -m pip freeze > evidence/python-packages.txt
          echo "SWIFTMITM_CLIENT_PYTHON=$RUNNER_TEMP/clients/bin/python" >> "$GITHUB_ENV"
      - name: Install pinned browser
        if: matrix.partition == 'browser'
        run: |
          case "$(uname -m)" in
            arm64) platform=mac-arm64 ;;
            x86_64) platform=mac-x64 ;;
            *) exit 1 ;;
          esac
          curl --fail --location --output "$RUNNER_TEMP/chrome.zip" \
            "https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.47/$platform/chrome-$platform.zip"
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chromium"
          chromium="$RUNNER_TEMP/chromium/chrome-$platform/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          "$chromium" --version > evidence/chromium.txt
          echo "SWIFTMITM_CHROMIUM_PATH=$chromium" >> "$GITHUB_ENV"
      - name: Download independently built public consumer
        if: matrix.partition == 'compatibility'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: consumer-current-${{ github.sha }}
          path: ${{ runner.temp }}/consumer
      - name: Prepare public consumer executable
        if: matrix.partition == 'compatibility'
        run: |
          test "$(cat "$RUNNER_TEMP/consumer/candidate-sha.txt")" = "$GITHUB_SHA"
          tar -xzf "$RUNNER_TEMP/consumer/FirstCapture.tar.gz" -C "$RUNNER_TEMP/consumer"
          test -x "$RUNNER_TEMP/consumer/FirstCapture"
          tar -xzf "$RUNNER_TEMP/consumer/InterceptionLab.tar.gz" -C "$RUNNER_TEMP/consumer"
          test -x "$RUNNER_TEMP/consumer/InterceptionLab"
          echo "SWIFTMITM_INTERCEPTION_LAB=$RUNNER_TEMP/consumer/InterceptionLab" >> "$GITHUB_ENV"
          echo "SWIFTMITM_FIRST_CAPTURE=$RUNNER_TEMP/consumer/FirstCapture" >> "$GITHUB_ENV"
      - name: Generate independent protobuf descriptors
        if: matrix.partition == 'behavior'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/protoc.zip" \
            https://github.com/protocolbuffers/protobuf/releases/download/v32.1/protoc-32.1-osx-universal_binary.zip
          echo "95a1e03847cf7057b2db1b68fb92685c3cd9d14e777a879475663adc13989cd7  $RUNNER_TEMP/protoc.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          "$RUNNER_TEMP/protoc/bin/protoc" --version | tee evidence/protoc.txt
          "$RUNNER_TEMP/protoc/bin/protoc" --proto_path=Tests/Clients/Stage2 \
            --include_imports --descriptor_set_out="$RUNNER_TEMP/stage2-descriptor.pb" probe.proto
          "$RUNNER_TEMP/protoc/bin/protoc" --proto_path=Tests/Clients/Stage2 \
            --include_imports --descriptor_set_out="$RUNNER_TEMP/stage2-renamed-descriptor.pb" probe-renamed.proto
          python3 Tests/Clients/Stage2/make_compression_vectors.py "$RUNNER_TEMP/stage2-compression"
          python3 Tests/Clients/Stage2/semantic_vectors.py "$RUNNER_TEMP/stage2-compression"
          echo "STAGE2_COMPRESSION_VECTORS=$RUNNER_TEMP/stage2-compression" >> "$GITHUB_ENV"
          echo "STAGE2_DESCRIPTOR_PATH=$RUNNER_TEMP/stage2-descriptor.pb" >> "$GITHUB_ENV"
          echo "STAGE2_RENAMED_DESCRIPTOR_PATH=$RUNNER_TEMP/stage2-renamed-descriptor.pb" >> "$GITHUB_ENV"
      - name: Build and discover executable tests
        run: |
          swift build --build-tests --force-resolved-versions -Xswiftc -warnings-as-errors
          swift test list --skip-build > evidence/discovered-tests.txt
          git diff --exit-code -- Package.resolved
      - name: Partition every discovered method exactly once
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          python3 - <<'PY'
          import collections, os, pathlib, re
          root = pathlib.Path('evidence')
          tests = [line.strip() for line in (root / 'discovered-tests.txt').read_text().splitlines()
                   if re.fullmatch(r'SwiftMITMTests\.\w+/test\w+', line.strip())]
          assert tests, 'No XCTest methods discovered'
          assert len(tests) == len(set(tests)), 'Duplicate discovered methods'
          resources = {'Phase6OpaqueResourceTests', 'Phase6TransparentResourceTests',
                       'ProductionProxyBackpressureTests', 'PublicProxyHTTP2WebSocketBackpressureTests',
                       'StreamingBackpressureTests', 'Release022CorrelationResourceTests',
                       'Stage2ControlResourceAcceptanceTests', 'Stage2CancellationAcceptanceTests',
                       'Stage2SharedBudgetAcceptanceTests', 'Stage2CapacityAcceptanceTests',
                       'Stage2AggregateCapacityAcceptanceTests'}
          compatibility = {'AppleTLSProxyCompatibilityTests', 'Phase4PublicTransparentTLSTests',
                           'PublicProxyHTTP2WebSocketTests',
                           'Release022PublicTrustTests', 'Release022ClientCompatibilityTests',
                           'Release022IndependentGRPCCompatibilityTests',
                           'Release022ConsumerCompatibilityTests', 'Stage2ConsumerCompatibilityTests',
                           'Stage2PassiveTLSCompatibilityTests', 'Stage2HTTP2FaultCompatibilityTests',
                           'Stage2ControlBoundaryAcceptanceTests'}
          browser = {'Release022BrowserCompatibilityTests'}
          required = resources | compatibility | browser | {'Release022PublicHTTP1Tests',
                                                  'Release022PublicHTTP1ForwardingTests',
                                                  'Release022PublicHTTP1OctetTests',
                                                  'Release022PublicHTTP2StreamingTests',
                                                  'Release022PublicHTTP2MalformedTests',
                                                  'Release022PublicReadOwnershipTests',
                                                  'Stage2SemanticBoundaryAcceptanceTests',
                                                  'Stage2ReplayBoundaryAcceptanceTests'}
          classes = {test.split('.', 1)[1].split('/', 1)[0] for test in tests}
          assert required <= classes, f'Missing required classes: {sorted(required - classes)}'
          expected = {
              'Stage2AggregateCapacityAcceptanceTests': {
                  'testSharedGiBCeilingRejectsObservationAndKeepsWire'},
              'Stage2CapacityAcceptanceTests': {
                  'testThirtyTwoFlowsCancelWithoutRetainedGrowth',
                  'testTwoHundredFiftySixFlowsCancelWithoutGrowth'},
              'Stage2ControlBoundaryAcceptanceTests': {
                  'testTLSHTTP1EditAndExpiredBreakpointPreserveOriginIsolation',
                  'testResponseResetAtByteOffsetPreservesHealthyFollowup'},
              'Stage2SemanticBoundaryAcceptanceTests': {
                  'testBinaryGRPCWebPublishesBeforeItsTrailerWithoutChangingForwardedBytes',
                  'testMalformedGRPCWebStopsOnlyItsObservationAndNextExchangeStillStreams',
                  'testCompressedGRPCMessageLimitAppliesToDecodedBytesWithoutTruncatingTransport'},
              'Stage2ReplayBoundaryAcceptanceTests': {
                  'testDroppedReplayResponseDoesNotRepeatTheCommittedPOST',
                  'testReplayRejectsSessionsAndLimitsCredentialOptInToSameOrigin'},
              'Stage2SharedBudgetAcceptanceTests': {
                  'testSharedInspectionBudgetExhaustionPreservesZeroRetentionForwardingAndReleasesCharges'},
              'Stage2PassiveTLSCompatibilityTests': {
                  'testPassiveTLSHTTP1RejectsExcessStreamWithoutEvictingHeldResponse'},
              'Stage2HTTP2FaultCompatibilityTests': {
                  'testIndependentHTTP2ThrottlePreservesLargeTerminalResponseSiblingsAndCancellation'},
              'Stage2CancellationAcceptanceTests': {
                  'testStopReportsNoncooperativeCallbackUntilItsTaskAndBytesActuallyExit',
                  'testRestartWithSharedEventLoopRetainsOrphanAccountingAndServesNewTraffic'},
              'Stage2ProvenanceAcceptanceTests': {
                  'testSyntheticResponseKeepsEditedRequestAndResponseHeadersInTheirOwnRepresentations'},
              'Stage2ConsumerCompatibilityTests': {
                  'testExternalInterceptionLabShowsSixPublicWorkflowsAndDrainsOnStop'},
              'Stage2CodingAcceptanceTests': {
                  'testIndependentGzipDeflateAndConcatenatedOuterMembersPreserveDecodedEvents',
                  'testSSEEventAtLimitAndPlusOneDoesNotTruncateTransport'},
              'Stage2ControlResourceAcceptanceTests': {
                  'testBodyReplacementAcceptsLimitAndRejectsLimitPlusOneBeforeEgress',
                  'testMapRemoteStripsCredentialsAndReauthorizesDeniedDestination',
                  'testOneHundredEligibleExchangesReuseOnlyTheirDownstreamSession',
                  'testAdmissionAtConnectionCeilingRejectsNewWorkWithoutEvictingActiveClient',
                  'testDelayedRequestDoesNotBlockIndependentRequest',
                  'testTwentyTerminalAndRejectedUpgradeCyclesReleaseInspectionState',
                  'testReplayUsesControlsAndAcceptsEarlyFinalResponseWithoutRetry',
                  'testResponseBodyReplacementPreservesTrailersAndOriginalCapture'},
              'Stage2HTTP2AcceptanceTests': {
                  'testNativeGRPCUsesPinnedSchemaWhileRegistryRejectsAndReplacesSnapshots',
                  'testPausedHTTP2StreamDoesNotBlockThirtyOneSiblingsAndCancelsOnce'},
              'Stage2InspectionAcceptanceTests': {
                  'testSSEPublishesFragmentedUTF8BeforeEOFWithZeroRawRetention',
                  'testMalformedCodingEndsObservationWithoutChangingForwardedBody',
                  'testGRPCWebTextPublishesPaddedSegmentsBeforeTrailerAndEOF',
                  'testFragmentedDeflateWebSocketMessageDoesNotDependOnFrameRetention',
                  'testWebSocketContextTakeoverKeepsTheDictionaryAcrossMessages'},
              'Stage2PriorKnowledgeAcceptanceTests': {
                  'testConfiguredPriorKnowledgeHTTP2ForwardsGRPCAndRejectsChangedAuthority'},
              'Stage2WorkflowAcceptanceTests': {
                  'testHeaderEditChangesOriginWithoutOverwritingOriginalEvidence',
                  'testBreakpointResumesOnceAndReleasesItsReservation',
                  'testReplaySendsOneCredentialFreePOSTAndRejectsIncompleteInputBeforeConnect',
                  'testHARExportRedactsEveryCapturedCredentialLocationAndOmitsBody'},
              'Release022ClientCompatibilityTests': {
                  'testCurlHTTPAndHTTPSWithExplicitTrust',
                  'testURLSessionHTTP11WithExplicitTrustAndProxy',
                  'testURLSessionHTTP2WithExplicitTrustAndProxy',
                  'testURLSessionHTTP2WithQualifiedHostnameAndExplicitTrustAndProxy',
                  'testURLSessionHTTP2WithSessionProxyDictionaryDiagnostic',
                  'testURLSessionHTTP2WithAlternateLoaderDiagnostic'},
              'Release022BrowserCompatibilityTests': {
                  'testWKWebViewSSEAndWebSocketThroughPublicProxyWithExplicitTrust',
                  'testChromiumSSEAndWebSocketThroughPublicProxyWithRunnerTrust'},
              'Release022IndependentGRPCCompatibilityTests': {
                  'testIndependentGRPCClientAndServerThroughPublicProxy'},
              'Release022ConsumerCompatibilityTests': {
                  'testExternalFirstCaptureCapturesHTTPAndHTTPSAndDrainsOnStop',
                  'testAsyncConsumerByteOverflowReportsTerminalLossWhileForwardingCompletes',
                  'testAsyncConsumerEventOverflowReportsTerminalLossWhileForwardingCompletes',
                  'testSIGTERMExitsWithUnreadStdoutAfterProxyForwardingCompletes',
                  'testBrokenStdoutReportsOutputFailureAndStillForwardsUntilSIGTERM'},
              'Release022PublicReadOwnershipTests': {
                  'testExplicitHTTPReadsClientHelloSentAfterCONNECTResponse',
                  'testExplicitWebSocketReadsLaterFramesAfterEachDirectionBarrier',
                  'testLocalStopFailsHeldCloseDelimitedResponseWithoutCleanEnd'},
              'Release022CorrelationResourceTests': {
                  'testCountCeilingThenOneOverFailsAllOutstandingIDs',
                  'testMethodByteCeilingThenOneOverFailsAllOutstandingIDs',
                  'testCombinedCeilingsThenOneOverFailsAllOutstandingIDs',
                  'testMaximumCorrelationDrainsAndRefillsOneHundredCycles'}}
          expected_methods = {f'SwiftMITMTests.{cls}/{method}'
                              for cls, methods in expected.items() for method in methods}
          assert expected_methods <= set(tests), f'Missing methods: {sorted(expected_methods - set(tests))}'
          minimum_classes = {'Stage2SemanticBoundaryAcceptanceTests', 'Stage2ReplayBoundaryAcceptanceTests',
                             'Stage2ControlBoundaryAcceptanceTests', 'Stage2CancellationAcceptanceTests',
                             'Stage2SharedBudgetAcceptanceTests', 'Stage2CapacityAcceptanceTests'}
          minimum = {test for test in tests if test.split('.', 1)[1].split('/', 1)[0] in minimum_classes}
          minimum.update({
              'SwiftMITMTests.Release022PublicTrustTests/testSNIIdentityAuthenticatesWithoutChangingCONNECTIPRoute',
              'SwiftMITMTests.Release022PublicTrustTests/testTrustedRootWithWrongSNIIdentityFailsWithoutOpaqueFallback',
              'SwiftMITMTests.Stage2InspectionAcceptanceTests/testSSEPublishesFragmentedUTF8BeforeEOFWithZeroRawRetention',
              'SwiftMITMTests.Stage2ControlResourceAcceptanceTests/testBodyReplacementAcceptsLimitAndRejectsLimitPlusOneBeforeEgress',
              'SwiftMITMTests.Stage2ControlResourceAcceptanceTests/testAdmissionAtConnectionCeilingRejectsNewWorkWithoutEvictingActiveClient',
              'SwiftMITMTests.Stage2WorkflowAcceptanceTests/testReplaySendsOneCredentialFreePOSTAndRejectsIncompleteInputBeforeConnect',
              'SwiftMITMTests.Release022ClientCompatibilityTests/testURLSessionHTTP11WithExplicitTrustAndProxy',
              'SwiftMITMTests.Release022ClientCompatibilityTests/testURLSessionHTTP2WithExplicitTrustAndProxy',
              'SwiftMITMTests.Release022BrowserCompatibilityTests/testWKWebViewSSEAndWebSocketThroughPublicProxyWithExplicitTrust'})
          assert minimum and minimum <= set(tests), 'Minimum-runtime selection is missing from discovery'
          (root / 'minimum-tests.txt').write_text('\n'.join(sorted(minimum)) + '\n')
          partitions = collections.defaultdict(list)
          for test in sorted(tests):
              cls = test.split('.', 1)[1].split('/', 1)[0]
              partition = ('resources' if cls in resources else 'compatibility' if cls in compatibility
                           else 'browser' if cls in browser else 'behavior')
              partitions[partition].append(test)
          assigned = [test for methods in partitions.values() for test in methods]
          assert collections.Counter(assigned) == collections.Counter(tests), 'Partition omissions or duplicates'
          for partition in ('behavior', 'compatibility', 'resources', 'browser'):
              assert partitions[partition], f'Empty required partition: {partition}'
              (root / f'{partition}-tests.txt').write_text('\n'.join(partitions[partition]) + '\n')
          selected = partitions[os.environ['PARTITION']]
          (root / 'filter.txt').write_text('^(' + '|'.join(re.escape(test) for test in selected) + ')$')
          print({key: len(value) for key, value in partitions.items()})
          PY
      - name: Export current XCTest products and generated fixtures
        if: matrix.partition == 'behavior'
        run: |
          export TEST_PRODUCTS="$(swift build --show-bin-path)"
          python3 - <<'PY'
          import json, os, pathlib, platform, shutil, subprocess, tarfile
          products = pathlib.Path(os.environ['TEST_PRODUCTS'])
          bundles = list(products.glob('*.xctest'))
          assert len(bundles) == 1, f'Expected one current XCTest bundle, found {len(bundles)}'
          bundle = bundles[0]
          executables = [p for p in (bundle / 'Contents/MacOS').iterdir() if p.is_file()]
          assert len(executables) == 1, 'Expected one XCTest executable'
          export = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minimum-xctest'
          payload = export / 'payload'
          (payload / 'products').mkdir(parents=True)
          shutil.copytree(bundle, payload / 'products' / bundle.name, symlinks=True)
          for resource in products.glob('*.bundle'):
              shutil.copytree(resource, payload / 'products' / resource.name, symlinks=True)
          pending, copied, linkage = [executables[0]], set(), []
          while pending:
              binary = pending.pop()
              links = subprocess.check_output(['otool', '-L', str(binary)], text=True)
              linkage.append(links)
              for line in links.splitlines()[1:]:
                  dependency = products / pathlib.Path(line.strip().split(' (', 1)[0]).name
                  if dependency.suffix == '.dylib' and dependency.is_file() and dependency.name not in copied:
                      assert dependency.resolve().parent == products.resolve(), 'Library is not an adjacent product'
                      shutil.copy2(dependency, payload / 'products' / dependency.name)
                      copied.add(dependency.name)
                      pending.append(dependency)
          shutil.copytree(pathlib.Path(os.environ['STAGE2_COMPRESSION_VECTORS']), payload / 'compression')
          for variable in ('STAGE2_DESCRIPTOR_PATH', 'STAGE2_RENAMED_DESCRIPTOR_PATH'):
              shutil.copy2(os.environ[variable], payload / pathlib.Path(os.environ[variable]).name)
          for name in ('minimum-tests.txt', 'swift.txt', 'xcode.txt'):
              shutil.copy2(pathlib.Path('evidence') / name, payload / name)
          (payload / 'manifest.json').write_text(json.dumps({'candidate': os.environ['GITHUB_SHA'],
              'checkout': str(pathlib.Path.cwd()), 'architecture': platform.machine(), 'bundle': bundle.name}))
          (payload / 'linkage.txt').write_text('\n'.join(linkage))
          for tool, destination in ((['file'], 'architecture.txt'), (['otool', '-l'], 'load-commands.txt')):
              (payload / destination).write_text(subprocess.check_output(tool + [str(executables[0])], text=True))
          with tarfile.open(export / 'xctest.tar.gz', 'w:gz') as archive:
              archive.add(payload, arcname='payload')
          PY
      - name: Retain execution-only XCTest artifact before partition execution
        if: matrix.partition == 'behavior'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimum-xctest-${{ github.sha }}
          path: ${{ runner.temp }}/minimum-xctest/xctest.tar.gz
          if-no-files-found: error
      - name: Prepare qualified runner hostname for native HTTP2 comparison
        if: matrix.partition == 'compatibility'
        run: |
          cp Tests/Support/Release022RunnerInterface.swift "$RUNNER_TEMP/runner-interface.swift"
          cat >> "$RUNNER_TEMP/runner-interface.swift" <<'SWIFT'
          print(try release022RunnerIPv4())
          SWIFT
          address="$(swift "$RUNNER_TEMP/runner-interface.swift")"
          hostname="swiftmitm-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.test"
          python3 - "$address" "$hostname" "$RUNNER_TEMP/swiftmitm-hosts-line.candidate" <<'PY'
          import ipaddress, pathlib, sys
          address = ipaddress.IPv4Address(sys.argv[1])
          assert address.is_private and not address.is_loopback and not address.is_link_local
          pathlib.Path(sys.argv[3]).write_text(f'{address} {sys.argv[2]}\n')
          PY
          sudo -n "$(command -v python3)" - "$RUNNER_TEMP/swiftmitm-hosts-line" <<'PY'
          import pathlib, sys
          hosts = pathlib.Path('/etc/hosts')
          ledger = pathlib.Path(sys.argv[1])
          line, existing = pathlib.Path(sys.argv[1] + '.candidate').read_bytes(), hosts.read_bytes()
          assert not existing or existing.endswith(b'\n'), 'Expected line-terminated runner hosts file'
          assert line not in existing.splitlines(keepends=True), 'Runner alias already exists'
          ledger.write_bytes(line)
          with hosts.open('ab') as stream: stream.write(line)
          PY
          echo "SWIFTMITM_TEST_DNS_HOST=$hostname" >> "$GITHUB_ENV"
      - name: Run partition
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          options=(--parallel --num-workers 1)
          if [[ "$PARTITION" == behavior ]]; then options=(--parallel); fi
          swift test --verbose --skip-build "${options[@]}" --filter "$(cat evidence/filter.txt)" \
            --xunit-output evidence/results.xml 2>&1 | tee evidence/tests.log
      - name: Require every selected method to execute
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          python3 - <<'PY'
          import collections, os, pathlib, re, xml.etree.ElementTree as ET
          root = pathlib.Path('evidence')
          selected = (root / f'{os.environ["PARTITION"]}-tests.txt').read_text().splitlines()
          report = ET.parse(root / 'results.xml')
          executed = [f'{case.attrib["classname"]}/{case.attrib["name"]}'
                      for case in report.iter('testcase')]
          assert collections.Counter(selected) == collections.Counter(executed), 'Executed methods differ from partition'
          assert report.find('.//failure') is None, 'Test failure in result artifact'
          assert report.find('.//skipped') is None, 'Skipped test in result artifact'
          assert not re.search(r"Test Case .* skipped", (root / 'tests.log').read_text()), 'XCTest skip is not qualification'
          PY
      - name: Remove only the qualified runner hostname entry
        if: always() && matrix.partition == 'compatibility'
        run: |
          if [[ -f "$RUNNER_TEMP/swiftmitm-hosts-line" ]]; then
            sudo -n "$(command -v python3)" - "$RUNNER_TEMP/swiftmitm-hosts-line" <<'PY'
          import pathlib, sys
          hosts = pathlib.Path('/etc/hosts')
          line = pathlib.Path(sys.argv[1]).read_bytes()
          retained = [entry for entry in hosts.read_bytes().splitlines(keepends=True) if entry != line]
          hosts.write_bytes(b''.join(retained))
          assert line not in hosts.read_bytes().splitlines(keepends=True), 'Runner alias cleanup failed'
          PY
          fi
      - name: Retain candidate test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.partition }}-${{ matrix.os }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  quality:
    name: Format and lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned formatting tools
        id: formatting-tools
        run: |
          mkdir -p "$RUNNER_TEMP/swiftformat" "$RUNNER_TEMP/swiftlint"
          curl --fail --location --output "$RUNNER_TEMP/swiftformat.zip" \
            https://github.com/nicklockwood/SwiftFormat/releases/download/0.64.1/swiftformat.zip
          curl --fail --location --output "$RUNNER_TEMP/swiftlint.zip" \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip
          echo '0e5762a848d738602c7a983b26812031e634d85e357db070968b9c805f253eff  '"$RUNNER_TEMP/swiftformat.zip" | shasum -a 256 -c -
          echo 'c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0  '"$RUNNER_TEMP/swiftlint.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/swiftformat.zip" -d "$RUNNER_TEMP/swiftformat"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          "$RUNNER_TEMP/swiftformat/swiftformat" --version
          "$RUNNER_TEMP/swiftlint/swiftlint" version
      - name: Check formatting
        id: formatting
        run: |
          for source_path in Sources Tests Examples Inspection Package.swift; do
            "$RUNNER_TEMP/swiftformat/swiftformat" "$source_path" --lint
          done
      - name: Check lint
        if: ${{ !cancelled() && steps.formatting-tools.outcome == 'success' }}
        run: '"$RUNNER_TEMP/swiftlint/swiftlint" lint --strict --quiet'
      - name: Prepare formatting repair patch
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        run: |
          for source_path in Sources Tests Examples Inspection Package.swift; do
            "$RUNNER_TEMP/swiftformat/swiftformat" "$source_path"
          done
          git diff --binary > "$RUNNER_TEMP/formatting.patch"
      - name: Retain formatting repair patch
        if: ${{ failure() && steps.formatting.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formatting-repair-${{ github.sha }}
          path: ${{ runner.temp }}/formatting.patch
          if-no-files-found: error

  distribution:
    name: Candidate distribution
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build release and versioned documentation before tagging
        run: |
          mkdir -p distribution
          version="$(sed -n '1s/^# SwiftMITM //p' RELEASE_NOTES.md)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          swift --version > distribution/swift.txt
          sw_vers > distribution/os.txt
          xcodebuild -version > distribution/xcode.txt
          grep -Fx 'Xcode 27.1' distribution/xcode.txt
          grep -Fx 'Build version 27A9275' distribution/xcode.txt
          grep -Eq 'Swift version 6\.4([ .]|$)' distribution/swift.txt
          swift build -c release --force-resolved-versions -Xswiftc -warnings-as-errors
          swift package --force-resolved-versions dump-symbol-graph --minimum-access-level public
          graph="$(find .build -type d -name symbolgraph -print -quit)"
          test -n "$graph"
          mkdir -p "$RUNNER_TEMP/swiftmitm-symbols"
          cp "$graph"/SwiftMITM.symbols.json "$RUNNER_TEMP/swiftmitm-symbols/"
          for extension_graph in "$graph"/SwiftMITM@*.symbols.json; do
            if [[ -f "$extension_graph" ]]; then cp "$extension_graph" "$RUNNER_TEMP/swiftmitm-symbols/"; fi
          done
          xcrun docc convert Sources/SwiftMITM.docc \
            --additional-symbol-graph-dir "$RUNNER_TEMP/swiftmitm-symbols" \
            --output-path "$RUNNER_TEMP/SwiftMITM.doccarchive" \
            --fallback-display-name SwiftMITM \
            --fallback-bundle-identifier com.ul0gic.SwiftMITM \
            --fallback-bundle-version "$version" \
            --warnings-as-errors
          ditto -c -k --keepParent "$RUNNER_TEMP/SwiftMITM.doccarchive" "distribution/SwiftMITM-$version.doccarchive.zip"
          printf '%s\n' "$GITHUB_SHA" > distribution/candidate-sha.txt
          printf '%s\n' "$version" > distribution/version.txt
          shasum -a 256 distribution/*.zip > distribution/SHA256SUMS
          git diff --exit-code -- Package.resolved
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swiftmitm-docc-${{ github.sha }}
          path: distribution/
          if-no-files-found: error

  consumer:
    name: External consumer (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: current
            os: xcode-27
          - compiler: swift-6.4.1
            os: xcode-27
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install signed Swift 6.4.1 toolchain
        if: matrix.compiler == 'swift-6.4.1'
        run: |
          curl --fail --location --output "$RUNNER_TEMP/swift-6.4.1.pkg" \
            https://download.swift.org/swift-6.4.1-release/xcode/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-osx.pkg
          pkgutil --check-signature "$RUNNER_TEMP/swift-6.4.1.pkg" | tee "$RUNNER_TEMP/swift-signature.txt"
          grep -F 'Developer ID Installer: Swift Open Source (V9AUD2URP3)' "$RUNNER_TEMP/swift-signature.txt"
          installer -target CurrentUserHomeDirectory -pkg "$RUNNER_TEMP/swift-6.4.1.pkg"
          echo 'TOOLCHAINS=swift' >> "$GITHUB_ENV"
      - name: Compile public example as external package at candidate revision
        env:
          COMPILER: ${{ matrix.compiler }}
        run: |
          mkdir -p evidence
          swift --version | tee evidence/swift.txt
          sw_vers > evidence/os.txt
          xcodebuild -version > evidence/xcode.txt
          grep -Fx 'Xcode 27.1' evidence/xcode.txt
          grep -Fx 'Build version 27A9275' evidence/xcode.txt
          if [[ "$COMPILER" == swift-6.4.1 ]]; then
            grep -Eq 'Swift version 6\.4\.1([ (]|$)' evidence/swift.txt
            cp "$RUNNER_TEMP/swift-signature.txt" evidence/
          else
            grep -Eq 'Swift version 6\.4([ .]|$)' evidence/swift.txt
          fi
          git rev-parse HEAD > evidence/candidate-sha.txt
          for example in FirstCapture InterceptionLab; do
            export EXAMPLE="$example"
            cp -R "Examples/$example" "$RUNNER_TEMP/$example"
            cp Package.resolved "$RUNNER_TEMP/$example/Package.resolved"
            python3 - <<'PY_MANIFEST'
          import os, pathlib
          manifest = pathlib.Path(os.environ['RUNNER_TEMP']) / os.environ['EXAMPLE'] / 'Package.swift'
          source = manifest.read_text()
          old = '.package(path: "../..")'
          assert source.count(old) == 1, 'Expected the public example local dependency once'
          dependency = f'.package(url: "file://{os.environ["GITHUB_WORKSPACE"]}", revision: "{os.environ["GITHUB_SHA"]}")'
          manifest.write_text(source.replace(old, dependency))
          PY_MANIFEST
            (
              cd "$RUNNER_TEMP/$example"
              swift build -c release -Xswiftc -warnings-as-errors 2>&1 | tee "$GITHUB_WORKSPACE/evidence/$example-build.log"
              cp Package.resolved "$GITHUB_WORKSPACE/evidence/$example-Package.resolved"
              python3 - <<'PY_PINS'
          import json, os, pathlib
          candidate = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          original = {pin['identity']: pin['state'] for pin in json.loads((candidate / 'Package.resolved').read_text())['pins']}
          external = {pin['identity']: pin['state'] for pin in json.loads(pathlib.Path('Package.resolved').read_text())['pins']}
          assert external['swift-mitm']['revision'] == os.environ['GITHUB_SHA'], 'Consumer did not resolve the candidate'
          assert all(external.get(name) == state for name, state in original.items()), 'Consumer dependency versions drifted'
          PY_PINS
              if [[ "$COMPILER" == current ]]; then
                binary_directory="$(swift build -c release --show-bin-path)"
                tar -czf "$GITHUB_WORKSPACE/evidence/$example.tar.gz" -C "$binary_directory" "$example"
              fi
            )
          done
      - name: Retain external compiler evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-${{ matrix.compiler }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  minimum-runtime:
    name: macOS 26 public consumers and native acceptance
    needs: [consumer, tests]
    if: ${{ !cancelled() }}
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: consumer-current-${{ github.sha }}
          path: ${{ runner.temp }}/consumer
      - name: Set up independent peer Python
        if: ${{ !cancelled() }}
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install pinned public-consumer peers
        if: ${{ !cancelled() && steps.peer-python.outcome == 'success' }}
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -m venv "$RUNNER_TEMP/minimum-clients"
          "$RUNNER_TEMP/minimum-clients/bin/python" -m pip install --only-binary=:all: \
            cryptography==50.0.2 typing-extensions==4.16.0 cffi==2.1.1 pycparser==3.12 grpcio==1.85.0
          echo "SWIFTMITM_CLIENT_PYTHON=$RUNNER_TEMP/minimum-clients/bin/python" >> "$GITHUB_ENV"
      - name: Exercise the Xcode 27.1 binary on the deployment minimum
        run: |
          mkdir -p evidence
          sw_vers > evidence/os.txt
          grep -Eq '^ProductVersion:[[:space:]]+26\.' evidence/os.txt
          test "$(cat "$RUNNER_TEMP/consumer/candidate-sha.txt")" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/consumer/candidate-sha.txt" evidence/
          cp "$RUNNER_TEMP/consumer/swift.txt" evidence/build-swift.txt
          cp "$RUNNER_TEMP/consumer/xcode.txt" evidence/build-xcode.txt
          tar -xzf "$RUNNER_TEMP/consumer/FirstCapture.tar.gz" -C "$RUNNER_TEMP/consumer"
          export OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL_BIN" version > evidence/openssl.txt
          python3 - <<'PY'
          import http.server, json, os, pathlib, selectors, signal, subprocess, tempfile, threading, time
          body = b'SwiftMITM macOS 26 runtime smoke\n'
          class Origin(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *_):
                  pass
          evidence = pathlib.Path('evidence')
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'consumer/FirstCapture'
          origin = http.server.HTTPServer(('127.0.0.1', 0), Origin)
          origin_thread = threading.Thread(target=origin.serve_forever)
          origin_thread.start()
          process = None
          try:
              with tempfile.TemporaryDirectory() as temporary:
                  root = pathlib.Path(temporary)
                  key, certificate = root / 'ca-key.pem', root / 'ca.pem'
                  subprocess.run([os.environ['OPENSSL_BIN'], 'genpkey', '-algorithm', 'EC', '-pkeyopt',
                                  'ec_paramgen_curve:P-256', '-out', str(key)], check=True, timeout=20)
                  subprocess.run([os.environ['OPENSSL_BIN'], 'req', '-new', '-x509', '-key', str(key),
                                  '-out', str(certificate), '-days', '1', '-subj', '/CN=SwiftMITM CI',
                                  '-addext', 'basicConstraints=critical,CA:TRUE',
                                  '-addext', 'keyUsage=critical,keyCertSign,cRLSign'], check=True, timeout=20)
                  with (evidence / 'stderr.txt').open('wb') as errors:
                      process = subprocess.Popen([str(binary), '--ca-cert', str(certificate),
                          '--ca-key', str(key), '--port', '0', '--allow-internal'],
                          stdout=subprocess.PIPE, stderr=errors)
                      with selectors.DefaultSelector() as selector:
                          selector.register(process.stdout, selectors.EVENT_READ)
                          deadline = time.monotonic() + 20
                          first = bytearray()
                          while not first.endswith(b'\n'):
                              assert selector.select(timeout=max(0, deadline - time.monotonic())), 'Proxy did not announce startup'
                              chunk = os.read(process.stdout.fileno(), 4096)
                              assert chunk, 'Proxy exited before announcing startup'
                              first.extend(chunk)
                      listening = json.loads(first)
                      assert listening['type'] == 'listening'
                      response = subprocess.run(['/usr/bin/curl', '--silent', '--show-error', '--fail',
                          '--max-time', '20', '--noproxy', '', '--proxy',
                          f'http://127.0.0.1:{listening["port"]}',
                          f'http://127.0.0.1:{origin.server_port}/smoke'],
                          check=True, stdout=subprocess.PIPE, timeout=25)
                      assert response.stdout == body, 'Forwarded response differs from origin bytes'
                      process.send_signal(signal.SIGINT)
                      remaining, _ = process.communicate(timeout=20)
                      transcript = first + remaining
                      (evidence / 'events.jsonl').write_bytes(transcript)
                      assert process.returncode == 0, 'Proxy did not stop cleanly'
                      events = [json.loads(line)['type'] for line in transcript.splitlines()]
                      assert events.count('requestHead') == 1 and events.count('responseEnd') == 1
                      assert events[-1] == 'stopped'
                      assert not {'streamError', 'connectionFailure', 'deliveryLoss'} & set(events)
                  (evidence / 'scope.txt').write_text(
                      'Passed public startup, HTTP forwarding/capture and SIGINT stop only.\n'
                      'TLS, streaming clients and resource ceilings on macOS 26 remain unverified.\n')
          finally:
              if process is not None and process.poll() is None:
                  process.kill()
                  process.wait(timeout=10)
              origin.shutdown()
              origin.server_close()
              origin_thread.join(timeout=10)
          PY
      - name: Exercise six inspection and debugging workflows on macOS 26
        run: |
          tar -xzf "$RUNNER_TEMP/consumer/InterceptionLab.tar.gz" -C "$RUNNER_TEMP/consumer"
          "$SWIFTMITM_CLIENT_PYTHON" --version > evidence/python.txt
          "$SWIFTMITM_CLIENT_PYTHON" -m pip freeze > evidence/python-packages.txt
          "$SWIFTMITM_CLIENT_PYTHON" Tests/Clients/Stage2/lab_acceptance.py \
            --binary "$RUNNER_TEMP/consumer/InterceptionLab" 2>&1 | tee evidence/lab-acceptance.log
          printf 'Additional public-consumer proof: trusted TLS, SSE, gRPC, WebSocket, paused edit, replay and redacted HAR.\n' >> evidence/scope.txt
          printf 'The full native-client and resource matrix on macOS 26 remains unverified.\n' >> evidence/scope.txt
      - name: Download candidate native XCTest products
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: minimum-xctest-${{ github.sha }}
          path: ${{ runner.temp }}/minimum-xctest
      - name: Execute selected Xcode 27.1 tests on macOS 26 without rebuilding
        if: ${{ !cancelled() }}
        run: |
          mkdir -p evidence
          tar -xzf "$RUNNER_TEMP/minimum-xctest/xctest.tar.gz" -C "$RUNNER_TEMP/minimum-xctest"
          export RUNTIME_XCTEST="$(xcrun --find xctest)"
          python3 - <<'PY'
          import collections, json, os, pathlib, platform, re, shutil, subprocess
          payload = pathlib.Path(os.environ['RUNNER_TEMP']) / 'minimum-xctest/payload'
          metadata = json.loads((payload / 'manifest.json').read_text())
          assert metadata['candidate'] == os.environ['GITHUB_SHA'], 'XCTest candidate mismatch'
          assert metadata['checkout'] == str(pathlib.Path.cwd()), 'Producer #filePath checkout differs from runtime checkout'
          assert metadata['architecture'] == platform.machine(), 'Producer/runtime architectures differ'
          assert platform.machine() in (payload / 'architecture.txt').read_text(), 'Bundle architecture differs'
          minimums = re.findall(r'\bminos\s+([\d.]+)', (payload / 'load-commands.txt').read_text())
          assert minimums and all(int(value.split('.')[0]) <= 26 for value in minimums), 'Bundle requires a newer OS'
          assert subprocess.check_output(['sw_vers', '-productVersion'], text=True).startswith('26.'), 'Wrong runtime OS'
          selected = (payload / 'minimum-tests.txt').read_text().splitlines()
          assert selected and len(selected) == len(set(selected)), 'Empty or duplicate native selection'
          for name in ('manifest.json', 'architecture.txt', 'linkage.txt', 'load-commands.txt',
                       'minimum-tests.txt', 'swift.txt', 'xcode.txt'):
              shutil.copy2(payload / name, pathlib.Path('evidence') / f'native-{name}')
          developer = pathlib.Path(os.environ['DEVELOPER_DIR'])
          platform_developer = developer / 'Platforms/MacOSX.platform/Developer'
          library_paths = [payload / 'products', platform_developer / 'usr/lib']
          library_paths += sorted((developer / 'Toolchains/XcodeDefault.xctoolchain/usr/lib').glob('swift*/macosx'))
          environment = {'PATH': '/usr/bin:/bin:/usr/sbin:/sbin', 'HOME': os.environ['HOME'],
              'TMPDIR': os.environ.get('TMPDIR', os.environ['RUNNER_TEMP']), 'LANG': 'en_US.UTF-8',
              'DEVELOPER_DIR': str(developer), 'PYTHONDONTWRITEBYTECODE': '1',
              'DYLD_FRAMEWORK_PATH': str(platform_developer / 'Library/Frameworks'),
              'DYLD_LIBRARY_PATH': ':'.join(map(str, library_paths)),
              'SWIFTMITM_CLIENT_PYTHON': os.environ['SWIFTMITM_CLIENT_PYTHON'],
              'STAGE2_COMPRESSION_VECTORS': str(payload / 'compression'),
              'STAGE2_DESCRIPTOR_PATH': str(payload / 'stage2-descriptor.pb'),
              'STAGE2_RENAMED_DESCRIPTOR_PATH': str(payload / 'stage2-renamed-descriptor.pb')}
          results = []
          for identifier in selected:
              log = pathlib.Path('evidence') / ('native-' + identifier.replace('/', '-') + '.log')
              with log.open('w') as output:
                  result = subprocess.run([os.environ['RUNTIME_XCTEST'], '-XCTest', identifier,
                      str(payload / 'products' / metadata['bundle'])], env=environment,
                      stdout=output, stderr=subprocess.STDOUT, check=False)
              transcript = log.read_text(errors='replace')
              passed = [f'{cls}/{method}' for cls, method in re.findall(
                  r"Test Case '-\[([^ ]+) ([^]]+)\]' passed", transcript)]
              valid = result.returncode == 0 and collections.Counter(passed) == collections.Counter([identifier])
              valid = valid and not re.search(r'Test Case .* (?:failed|skipped)', transcript)
              results.append({'test': identifier, 'returncode': result.returncode, 'passed': valid})
              print(json.dumps(results[-1]), flush=True)
          pathlib.Path('evidence/native-results.json').write_text(json.dumps(results, indent=2))
          assert all(result['passed'] for result in results), 'Native XCTest failed, could not load, or did not execute its named method; see native logs'
          with pathlib.Path('evidence/scope.txt').open('a') as scope:
              scope.write(f'Passed {len(selected)} named native trust, inspection, control, replay, cancellation, budget, capacity, URLSession and WKWebView cases on macOS 26.\n')
              scope.write('Chromium, the qualified-hostname URLSession comparison, and the remaining full matrix on macOS 26 remain unverified.\n')
          PY
      - name: Retain minimum-runtime consumer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: minimum-runtime-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  performance:
    name: Disabled-feature performance regression
    runs-on: xcode-27
    timeout-minutes: 75
    env:
      BASELINE_REVISION: dc36969d94c9bbbfb2b7f8546b10ec441a4c3a13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: dc36969d94c9bbbfb2b7f8546b10ec441a4c3a13
          path: baseline-performance
          persist-credentials: false
      - name: Record the paired candidates and common harness
        run: |
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C baseline-performance rev-parse HEAD)" = "$BASELINE_REVISION"
          git rev-parse HEAD > evidence/candidate-sha.txt
          git -C baseline-performance rev-parse HEAD > evidence/baseline-sha.txt
          swift --version > evidence/swift.txt
          xcodebuild -version > evidence/xcode.txt
          sw_vers > evidence/os.txt
          uname -m > evidence/architecture.txt
          grep -Fx 'Xcode 27.1' evidence/xcode.txt
          grep -Fx 'Build version 27A9275' evidence/xcode.txt
          grep -Eq 'Swift version 6\.4([ .]|$)' evidence/swift.txt
          printf '%s  %s\n' ba9b0596392cb69e086897d37f1c99f2b1e4fce5bc104cb8df1ded17edbb3d08 \
            .github/performance-baseline-compile.patch | shasum -a 256 -c -
          printf '%s  %s\n' 67098af5a8696f332c46a1cfaec05746728511698c743984b6bd520659b5b56c \
            .github/performance-baseline-typed-writes.patch | shasum -a 256 -c -
          git -C baseline-performance apply "$GITHUB_WORKSPACE/.github/performance-baseline-compile.patch"
          git -C baseline-performance apply "$GITHUB_WORKSPACE/.github/performance-baseline-typed-writes.patch"
          git -C baseline-performance diff --no-ext-diff --no-textconv --no-color --abbrev=7 --src-prefix=a/ --dst-prefix=b/ > evidence/baseline-compile.patch
          cat .github/performance-baseline-typed-writes.patch .github/performance-baseline-compile.patch \
            > evidence/baseline-expected.patch
          cmp evidence/baseline-expected.patch evidence/baseline-compile.patch
          GIT_INDEX_FILE="$RUNNER_TEMP/performance-baseline.index" git -C baseline-performance read-tree HEAD
          GIT_INDEX_FILE="$RUNNER_TEMP/performance-baseline.index" git -C baseline-performance add \
            Vendor/CSwiftMITMLLHTTP/include/swiftmitm_llhttp.h Sources/HTTP1/ExplicitHTTPProxyHandler.swift
          GIT_INDEX_FILE="$RUNNER_TEMP/performance-baseline.index" git -C baseline-performance write-tree \
            > evidence/baseline-patched-tree.txt
          cp -R Tests/Clients/PerformanceAcceptance baseline-performance/Tests/Clients/PerformanceAcceptance
          find Tests/Clients/PerformanceAcceptance -type f -exec shasum -a 256 {} + > evidence/harness-sha256.txt
      - name: Set up independent peer Python
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install pinned identity support
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -m venv "$RUNNER_TEMP/performance-peers"
          "$RUNNER_TEMP/performance-peers/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r Tests/Clients/PerformanceAcceptance/requirements.txt
          "$RUNNER_TEMP/performance-peers/bin/python" -m pip freeze > evidence/peer-versions.txt
      - name: Build both variants with their own committed pins
        run: |
          for variant in baseline candidate; do
            variant_root="$GITHUB_WORKSPACE"
            if [[ "$variant" == baseline ]]; then variant_root="$GITHUB_WORKSPACE/baseline-performance"; fi
            benchmark_package="$variant_root/Tests/Clients/PerformanceAcceptance"
            cp "$variant_root/Package.resolved" "$benchmark_package/Package.resolved"
            swift package --package-path "$benchmark_package" resolve
            cp "$variant_root/Package.resolved" "evidence/$variant-root-Package.resolved"
            cp "$benchmark_package/Package.resolved" "evidence/$variant-benchmark-Package.resolved"
            python3 - "$variant_root/Package.resolved" "$benchmark_package/Package.resolved" <<'PY_PINS'
          import json
          import sys
          def pins(path):
              with open(path) as source:
                  return {pin['identity']: pin['state'] for pin in json.load(source)['pins']}
          assert pins(sys.argv[1]) == pins(sys.argv[2]), 'benchmark altered committed pins'
          PY_PINS
            swift build --package-path "$benchmark_package" --configuration release \
              --product PerformanceAcceptance --force-resolved-versions -Xswiftc -warnings-as-errors \
              2>&1 | tee "evidence/$variant-build.log"
            binary_directory="$(swift build --package-path "$benchmark_package" --configuration release --show-bin-path)"
            printf '%s_BINARY=%s/PerformanceAcceptance\n' "$variant" "$binary_directory" >> "$GITHUB_ENV"
          done
      - name: Measure five interleaved pairs on the same runner
        timeout-minutes: 12
        run: |
          "$RUNNER_TEMP/performance-peers/bin/python" Tests/Clients/PerformanceAcceptance/compare.py \
            --baseline "$baseline_BINARY" --candidate "$candidate_BINARY" \
            --baseline-revision "$BASELINE_REVISION" --candidate-revision "$GITHUB_SHA" \
            --baseline-patch-sha256 ba9b0596392cb69e086897d37f1c99f2b1e4fce5bc104cb8df1ded17edbb3d08 \
            --baseline-typed-writes-patch-sha256 67098af5a8696f332c46a1cfaec05746728511698c743984b6bd520659b5b56c \
            --baseline-patched-tree "$(cat evidence/baseline-patched-tree.txt)" \
            --benchmark-revision "$GITHUB_SHA" --output evidence/performance-results.json
      - name: Retain performance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  verify:
    name: Verify
    needs: [tests, quality, distribution, consumer, minimum-runtime, performance]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require every configured candidate job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
          printf 'Candidate `%s`: all configured checks passed.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          printf 'Configured current-runtime clients: curl, URLSession HTTP/1.1 + HTTP/2, WKWebView SSE/WebSocket, pinned stable Chromium and independent gRPC.\n' >> "$GITHUB_STEP_SUMMARY"
