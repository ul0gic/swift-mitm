name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_validation:
        description: Run the package acceptance suite and compile documentation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  build:
    name: Release build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build package
        run: swift build -c release --force-resolved-versions -Xswiftc -warnings-as-errors

  consumer:
    name: Consumer and proxy smoke
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build separate SwiftPM consumer
        run: |
          cp -R Examples/FirstCapture "$RUNNER_TEMP/FirstCapture"
          cp Package.resolved "$RUNNER_TEMP/FirstCapture/Package.resolved"
          python3 - <<'PY_MANIFEST'
          import os, pathlib
          manifest = pathlib.Path(os.environ['RUNNER_TEMP']) / 'FirstCapture/Package.swift'
          source = manifest.read_text()
          original = '.package(path: "../..")'
          assert source.count(original) == 1
          dependency = f'.package(url: "file://{os.environ["GITHUB_WORKSPACE"]}", revision: "{os.environ["GITHUB_SHA"]}")'
          manifest.write_text(source.replace(original, dependency))
          PY_MANIFEST
          swift build --package-path "$RUNNER_TEMP/FirstCapture" -c release -Xswiftc -warnings-as-errors
          binary_directory="$(swift build --package-path "$RUNNER_TEMP/FirstCapture" -c release --show-bin-path)"
          echo "FIRST_CAPTURE_BINARY=$binary_directory/FirstCapture" >> "$GITHUB_ENV"
      - name: Exercise proxy startup, forwarding and shutdown
        run: |
          mkdir -p evidence
          export OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          python3 - <<'PY_SMOKE'
          import http.server, json, os, pathlib, selectors, signal, subprocess, tempfile, threading, time
          body = b'SwiftMITM proxy smoke\n'
          class Origin(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *_):
                  pass
          evidence = pathlib.Path('evidence')
          binary = pathlib.Path(os.environ['FIRST_CAPTURE_BINARY'])
          origin = http.server.HTTPServer(('127.0.0.1', 0), Origin)
          origin_thread = threading.Thread(target=origin.serve_forever)
          origin_thread.start()
          process = None
          try:
              with tempfile.TemporaryDirectory() as temporary:
                  root = pathlib.Path(temporary)
                  key, certificate = root / 'ca-key.pem', root / 'ca.pem'
                  subprocess.run([os.environ['OPENSSL_BIN'], 'genpkey', '-algorithm', 'EC', '-pkeyopt',
                                  'ec_paramgen_curve:P-256', '-out', str(key)], check=True, timeout=20)
                  subprocess.run([os.environ['OPENSSL_BIN'], 'req', '-new', '-x509', '-key', str(key),
                                  '-out', str(certificate), '-days', '1', '-subj', '/CN=SwiftMITM CI',
                                  '-addext', 'basicConstraints=critical,CA:TRUE',
                                  '-addext', 'keyUsage=critical,keyCertSign,cRLSign'], check=True, timeout=20)
                  with (evidence / 'stderr.txt').open('wb') as errors:
                      process = subprocess.Popen([str(binary), '--ca-cert', str(certificate),
                          '--ca-key', str(key), '--port', '0', '--allow-internal'],
                          stdout=subprocess.PIPE, stderr=errors)
                      with selectors.DefaultSelector() as selector:
                          selector.register(process.stdout, selectors.EVENT_READ)
                          deadline = time.monotonic() + 20
                          first = bytearray()
                          while not first.endswith(b'\n'):
                              assert selector.select(timeout=max(0, deadline - time.monotonic())), 'Proxy did not announce startup'
                              chunk = os.read(process.stdout.fileno(), 4096)
                              assert chunk, 'Proxy exited before announcing startup'
                              first.extend(chunk)
                      listening = json.loads(first)
                      assert listening['type'] == 'listening'
                      response = subprocess.run(['/usr/bin/curl', '--silent', '--show-error', '--fail',
                          '--max-time', '20', '--noproxy', '', '--proxy',
                          f'http://127.0.0.1:{listening["port"]}',
                          f'http://127.0.0.1:{origin.server_port}/smoke'],
                          check=True, stdout=subprocess.PIPE, timeout=25)
                      assert response.stdout == body, 'Forwarded response differs from origin bytes'
                      process.send_signal(signal.SIGINT)
                      remaining, _ = process.communicate(timeout=20)
                      transcript = first + remaining
                      (evidence / 'events.jsonl').write_bytes(transcript)
                      assert process.returncode == 0, 'Proxy did not stop cleanly'
                      events = [json.loads(line)['type'] for line in transcript.splitlines()]
                      assert events.count('requestHead') == 1 and events.count('responseEnd') == 1
                      assert events[-1] == 'stopped'
                      assert not {'streamError', 'connectionFailure', 'deliveryLoss'} & set(events)
          finally:
              if process is not None and process.poll() is None:
                  process.kill()
                  process.wait(timeout=10)
              origin.shutdown()
              origin.server_close()
              origin_thread.join(timeout=10)
          PY_SMOKE

  release-validation:
    name: Release acceptance and documentation
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_validation }}
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise the package through its acceptance suite
        run: |
          mkdir -p evidence
          swift test --force-resolved-versions -Xswiftc -warnings-as-errors --xunit-output evidence/acceptance.xml
          python3 - <<'PY_ACCEPTANCE'
          import xml.etree.ElementTree as ET
          cases = ET.parse('evidence/acceptance.xml').getroot().findall('.//testcase')
          assert len(cases) >= 16, f'Expected at least 16 acceptance cases, observed {len(cases)}'
          assert all(case.find('skipped') is None and case.find('failure') is None and case.find('error') is None for case in cases)
          assert any('testDescriptorLoadingDecodesStringFieldAndEnforcesConfiguredDepth' in case.attrib['name'] for case in cases)
          print(f'Passed {len(cases)} acceptance cases with no failures or skips')
          PY_ACCEPTANCE
      - name: Compile the DocC catalog against public symbols
        run: |
          swift package --force-resolved-versions -Xswiftc -warnings-as-errors dump-symbol-graph --minimum-access-level public
          symbol_graph_directory="$(find .build -type d -name symbolgraph -print -quit)"
          test -n "$symbol_graph_directory"
          mkdir "$RUNNER_TEMP/swiftmitm-doc-symbols"
          cp "$symbol_graph_directory"/SwiftMITM*.symbols.json "$RUNNER_TEMP/swiftmitm-doc-symbols/"
          xcrun docc convert Sources/SwiftMITM.docc \
            --additional-symbol-graph-dir "$RUNNER_TEMP/swiftmitm-doc-symbols" \
            --output-path "$RUNNER_TEMP/SwiftMITM.doccarchive" --warnings-as-errors
      - name: Check documentation file links
        run: |
          python3 - <<'PY_LINKS'
          import pathlib, re, urllib.parse
          documents = [pathlib.Path('README.md'), pathlib.Path('CONTRIBUTING.md')]
          documents += list(pathlib.Path('Documentation').glob('*.md'))
          documents += list(pathlib.Path('Sources/SwiftMITM.docc').glob('*.md'))
          documents += list(pathlib.Path('Examples').glob('*/README.md'))
          for document in documents:
              for target in re.findall(r'\[[^\]]*\]\(([^)]+)\)', document.read_text()):
                  target = target.strip('<>')
                  if urllib.parse.urlsplit(target).scheme or target.startswith('#'):
                      continue
                  path = urllib.parse.unquote(target.split('#', 1)[0])
                  assert (document.parent / path).exists(), f'{document}: missing {target}'
          print(f'Checked file links in {len(documents)} documentation pages')
          PY_LINKS
      - name: Run the documented HTTPS lab
        run: |
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          cp Package.resolved Examples/InterceptionLab/Package.resolved
          python3 - <<'PY_LAB'
          import os, pathlib, re, signal, subprocess
          blocks = re.findall(r'```sh\n(.*?)```', pathlib.Path('Documentation/LocalLab.md').read_text(), re.S)
          assert blocks, 'No executable lab recipe found'
          assertions = r'''
          python3 - "$LAB_DIR" <<'PY_OBSERVE'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          transcript = (root / 'inspection.log').read_text()
          assert transcript.count('sse dataBytes=') == 2, transcript
          assert 'paused GET /debug' in transcript, transcript
          assert 'original' in transcript and 'effective' in transcript, transcript
          assert 'inspectionComplete=true' in transcript and 'stopped' in transcript, transcript
          assert 'deliveryLoss' not in transcript and 'inspectionComplete=false' not in transcript, transcript
          archive = json.loads((root / 'replay.har').read_text())['log']
          assert archive['creator']['version'] == '0.2.3'
          assert len(archive['entries']) == 1
          request = archive['entries'][0]['request']
          assert 'lab-demo-token' not in request['url']
          assert {'name': 'token', 'value': '[REDACTED]'} in request['queryString']
          print('Documented HTTPS lab: SSE, edit, clean drain, replay and HAR passed')
          PY_OBSERVE
          '''
          recipe = '\n'.join(blocks)
          assert recipe.count('rm -rf "$LAB_DIR"') == 1
          recipe = recipe.replace('rm -rf "$LAB_DIR"', assertions + '\nrm -rf "$LAB_DIR"')
          script = pathlib.Path(os.environ['RUNNER_TEMP']) / 'swiftmitm-documented-lab.sh'
          script.write_text('set -euo pipefail\n' + recipe)
          process = subprocess.Popen(['bash', str(script)], start_new_session=True)
          try:
              assert process.wait(timeout=900) == 0, 'Documented lab failed'
          finally:
              try:
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
          PY_LAB
      - name: Compile and run the documented embedding example
        run: |
          python3 - <<'PY_EMBEDDING'
          import os, pathlib, re
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'SwiftMITMDocumentationExample'
          source = root / 'Sources/InspectionDemo'
          source.mkdir(parents=True)
          blocks = re.findall(r'```swift\n(.*?)```', pathlib.Path('Documentation/Embedding.md').read_text(), re.S)
          assert len(blocks) == 1, 'Expected one complete embedding executable'
          (source / 'InspectionDemo.swift').write_text(blocks[0])
          workspace = os.environ['GITHUB_WORKSPACE']
          revision = os.environ['GITHUB_SHA']
          (root / 'Package.swift').write_text(f'''// swift-tools-version: 6.4
          import PackageDescription
          let package = Package(
              name: "SwiftMITMDocumentationExample",
              platforms: [.macOS(.v26)],
              dependencies: [.package(url: "file://{workspace}", revision: "{revision}")],
              targets: [.executableTarget(name: "InspectionDemo", dependencies: [
                  .product(name: "SwiftMITM", package: "swift-mitm"),
                  .product(name: "SwiftMITMInspection", package: "swift-mitm")
              ])]
          )
          ''')
          (root / 'Package.resolved').write_bytes(pathlib.Path('Package.resolved').read_bytes())
          PY_EMBEDDING
          example="$RUNNER_TEMP/SwiftMITMDocumentationExample"
          swift build --package-path "$example" -c release -Xswiftc -warnings-as-errors
          binary_directory="$(swift build --package-path "$example" -c release --show-bin-path)"
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          "$openssl" genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out "$example/ca-key.pem"
          "$openssl" req -new -x509 -key "$example/ca-key.pem" -out "$example/ca-cert.pem" \
            -days 1 -subj '/CN=SwiftMITM documentation' \
            -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          "$binary_directory/InspectionDemo" "$example/ca-cert.pem" "$example/ca-key.pem" > "$example/output.txt"
          grep -Fx 'listening=8081' "$example/output.txt"
          grep -Fx 'heads=0 sse=0 complete=true' "$example/output.txt"

  verify:
    name: Verify
    needs: [build, consumer]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require both checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
