name: Stage 2 dependency feasibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Package.resolved'
      - 'Packages/SwiftMITMHTTP3/**'
      - 'Sources/**'
      - 'Vendor/**'
      - 'Tests/Clients/Stage2/HTTP3/**'
      - '.github/workflows/stage2-feasibility.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: stage2-feasibility-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  combined-graph:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record candidate and validate the committed Crypto5 requirement
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/candidate-sha.txt
          xcodebuild -version > evidence/xcode.txt
          swift --version > evidence/swift.txt
          sw_vers > evidence/os.txt
          grep -Fx 'Xcode 27.1' evidence/xcode.txt
          grep -Fx 'Build version 27A9275' evidence/xcode.txt
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Package.swift').read_text()
          requirement = '.package(url: "https://github.com/apple/swift-crypto.git", from: "5.0.0")'
          assert source.count(requirement) == 1, 'Probe requires the committed Crypto5 baseline'
          PY
      - name: Resolve and build combined graph
        working-directory: Packages/SwiftMITMHTTP3
        run: |
          swift package resolve
          cp Package.resolved "$GITHUB_WORKSPACE/evidence/combined-Package.resolved"
          swift build --target SwiftMITMHTTP3 --force-resolved-versions -Xswiftc -warnings-as-errors \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/http3-library-build.log"
          swift build --product HTTP3DependencyProbe --force-resolved-versions -Xswiftc -warnings-as-errors
          swift run --skip-build HTTP3DependencyProbe | tee "$GITHUB_WORKSPACE/evidence/combined-probe.txt"
      - name: Build and package the two-leg transport probe
        working-directory: Packages/SwiftMITMHTTP3
        run: |
          swift build --product HTTP3TransportProbe --force-resolved-versions -Xswiftc -warnings-as-errors \
            2>&1 | tee "$GITHUB_WORKSPACE/evidence/http3-build.log"
          cmp Package.resolved "$GITHUB_WORKSPACE/evidence/combined-Package.resolved"
          binary_directory="$(swift build --show-bin-path)"
          files=(HTTP3TransportProbe)
          for bundle in "$binary_directory"/*.bundle; do
            if [[ -d "$bundle" ]]; then
              files+=("${bundle##*/}")
            fi
          done
          mkdir -p "$GITHUB_WORKSPACE/transport-probe"
          tar -czf "$GITHUB_WORKSPACE/transport-probe/HTTP3TransportProbe.tar.gz" -C "$binary_directory" "${files[@]}"
          cp Package.resolved "$GITHUB_WORKSPACE/transport-probe/"
          cp "$GITHUB_WORKSPACE/evidence/"{candidate-sha,swift,xcode}.txt "$GITHUB_WORKSPACE/transport-probe/"
      - name: Retain the compiled transport probe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-http3-probe-${{ github.sha }}
          path: transport-probe/
          if-no-files-found: error
      - name: Build the public HTTP3 production consumer
        run: |
          host_package=Tests/Clients/Stage2/HTTP3/ProductionHost
          cp evidence/combined-Package.resolved "$host_package/Package.resolved"
          swift package --package-path "$host_package" resolve
          cp "$host_package/Package.resolved" evidence/production-Package.resolved
          python3 - <<'PY_PINS'
          import json
          def pins(path):
              with open(path) as source:
                  return {pin['identity']: pin['state'] for pin in json.load(source)['pins']}
          assert pins('evidence/combined-Package.resolved') == pins('evidence/production-Package.resolved')
          PY_PINS
          swift build --package-path "$host_package" --product HTTP3ProductionHost \
            --force-resolved-versions -Xswiftc -warnings-as-errors 2>&1 | tee evidence/production-build.log
          binary_directory="$(swift build --package-path "$host_package" --show-bin-path)"
          xcrun dsymutil "$binary_directory/HTTP3ProductionHost"
          files=(HTTP3ProductionHost HTTP3ProductionHost.dSYM)
          for bundle in "$binary_directory"/*.bundle; do
            if [[ -d "$bundle" ]]; then files+=("${bundle##*/}"); fi
          done
          mkdir -p production-host
          tar -czf production-host/HTTP3ProductionHost.tar.gz -C "$binary_directory" "${files[@]}"
          cp evidence/production-Package.resolved production-host/Package.resolved
          cp evidence/{candidate-sha,swift,xcode}.txt production-host/
      - name: Retain the compiled public HTTP3 consumer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-http3-production-host-${{ github.sha }}
          path: production-host/
          if-no-files-found: error
      - name: Record explicit scope of evidence
        run: |
          echo 'Dependency and core compatibility probe only; macOS26 evidence is the separate smoke job, no two-leg HTTP3 transport or final acceptance established.' > evidence/scope.txt
          cat evidence/scope.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Retain feasibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-feasibility-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  core-consumer:
    name: Build Crypto5 core consumer for macOS26
    needs: combined-graph
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-feasibility-${{ github.sha }}
          path: evidence/
      - name: Validate candidate and consumer compiler
        run: |
          test "$(cat evidence/candidate-sha.txt)" = "$GITHUB_SHA"
          xcodebuild -version > evidence/consumer-xcode.txt
          swift --version > evidence/consumer-swift.txt
          cmp evidence/xcode.txt evidence/consumer-xcode.txt
          cmp evidence/swift.txt evidence/consumer-swift.txt
      - name: Prepare Crypto5 core consumer for macOS26
        run: |
          cp evidence/combined-Package.resolved Examples/FirstCapture/Package.resolved
          swift package --package-path Examples/FirstCapture resolve
          cp Examples/FirstCapture/Package.resolved evidence/consumer-Package.resolved
          python3 - <<'PYTHON'
          import json
          def pins(path):
              return {p['identity']:p['state'] for p in json.load(open(path))['pins']}
          combined = pins('evidence/combined-Package.resolved')
          consumer = pins('evidence/consumer-Package.resolved')
          for name in combined.keys() & consumer.keys():
              assert combined[name] == consumer[name], f'Dependency drift: {name}'
          assert consumer['swift-crypto']['version'].startswith('5.')
          PYTHON
          swift build --package-path Examples/FirstCapture -c release -Xswiftc -warnings-as-errors
          mkdir -p core-consumer
          binary_directory="$(swift build --package-path Examples/FirstCapture -c release --show-bin-path)"
          tar -czf core-consumer/FirstCapture.tar.gz -C "$binary_directory" FirstCapture
          cp evidence/candidate-sha.txt evidence/swift.txt evidence/xcode.txt core-consumer/
      - name: Retain Crypto5 core consumer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-crypto5-consumer-${{ github.sha }}
          path: core-consumer/
          if-no-files-found: error

  core-compatibility:
    name: Standalone Crypto5 core with committed pins
    needs: combined-graph
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-feasibility-${{ github.sha }}
          path: graph-evidence/
      - name: Prove standalone trust and octet compatibility with committed pins
        run: |
          mkdir -p evidence
          test "$(cat graph-evidence/candidate-sha.txt)" = "$GITHUB_SHA"
          cp graph-evidence/candidate-sha.txt evidence/
          cp Package.resolved evidence/baseline-Package.resolved
          python3 - <<'PY_MANIFEST'
          from pathlib import Path
          source = Path('Package.swift').read_text()
          requirement = '.package(url: "https://github.com/apple/swift-crypto.git", from: "5.0.0")'
          assert source.count(requirement) == 1, 'Core requires the committed Crypto5 baseline'
          PY_MANIFEST
          swift build --build-tests --force-resolved-versions -Xswiftc -warnings-as-errors 2>&1 | tee evidence/core-build.log
          cp Package.resolved evidence/core-Package.resolved
          python3 - <<'PY_PINS'
          import json
          from pathlib import Path
          def pins(path):
              return {pin['identity']: pin for pin in json.loads(Path(path).read_text())['pins']}
          baseline = pins('evidence/baseline-Package.resolved')
          resolved = pins('evidence/core-Package.resolved')
          assert resolved['swift-crypto']['state']['version'].startswith('5.')
          changed = sorted(
              identity for identity in baseline.keys() | resolved.keys()
              if baseline.get(identity) != resolved.get(identity)
          )
          assert not changed, f'Standalone dependency drift: {changed}'
          PY_PINS
          swift test --skip-build --force-resolved-versions --parallel --num-workers 1 \
            --filter 'Release022PublicTrustTests|Release022PublicHTTP1OctetTests' \
            --xunit-output evidence/core-results.xml 2>&1 | tee evidence/core-tests.log
          python3 - <<'PY_RESULTS'
          import xml.etree.ElementTree as ET
          root = ET.parse('evidence/core-results.xml').getroot()
          cases = [case for case in root.iter('testcase') if case.find('skipped') is None]
          assert cases, 'Core compatibility must execute tests'
          assert not list(root.iter('failure')) and not list(root.iter('error'))
          assert any('Release022PublicTrustTests' in case.get('classname', '') for case in cases)
          assert any('Release022PublicHTTP1OctetTests' in case.get('classname', '') for case in cases)
          PY_RESULTS
      - name: Retain core compatibility evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-core-compatibility-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  http3-transport:
    name: Independent HTTP3 transport spike
    needs: combined-graph
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-feasibility-${{ github.sha }}
          path: graph-evidence/
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-http3-probe-${{ github.sha }}
          path: ${{ runner.temp }}/transport-probe
      - name: Validate the compiled probe and proven dependency graph
        run: |
          mkdir -p evidence
          test "$(cat graph-evidence/candidate-sha.txt)" = "$GITHUB_SHA"
          test "$(cat "$RUNNER_TEMP/transport-probe/candidate-sha.txt")" = "$GITHUB_SHA"
          cp graph-evidence/candidate-sha.txt evidence/
          xcodebuild -version > evidence/xcode.txt
          swift --version > evidence/swift.txt
          sw_vers > evidence/os.txt
          grep -Fx 'Xcode 27.1' evidence/xcode.txt
          grep -Fx 'Build version 27A9275' evidence/xcode.txt
          cmp evidence/xcode.txt "$RUNNER_TEMP/transport-probe/xcode.txt"
          cmp evidence/swift.txt "$RUNNER_TEMP/transport-probe/swift.txt"
          cp "$RUNNER_TEMP/transport-probe/Package.resolved" evidence/http3-Package.resolved
          cp graph-evidence/http3-build.log evidence/
          python3 - <<'PY_PINS'
          import json
          def pins(path):
              with open(path) as source:
                  return {pin['identity']: pin['state'] for pin in json.load(source)['pins']}
          assert pins('graph-evidence/combined-Package.resolved') == pins('evidence/http3-Package.resolved')
          PY_PINS
          tar -xzf "$RUNNER_TEMP/transport-probe/HTTP3TransportProbe.tar.gz" -C "$RUNNER_TEMP/transport-probe"
          test -x "$RUNNER_TEMP/transport-probe/HTTP3TransportProbe"
          echo "SWIFTMITM_HTTP3_PROBE=$RUNNER_TEMP/transport-probe/HTTP3TransportProbe" >> "$GITHUB_ENV"
      - name: Set up independent peer Python
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install isolated independent peers
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
        run: |
          peer_python="$PEER_PYTHON"
          "$peer_python" --version | tee evidence/python.txt
          "$peer_python" -m venv "$RUNNER_TEMP/http3-peers"
          "$RUNNER_TEMP/http3-peers/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r Tests/Clients/Stage2/HTTP3/requirements.txt
          "$RUNNER_TEMP/http3-peers/bin/python" -m pip freeze > evidence/http3-peer-versions.txt
      - name: Exercise verified TLS and independent HTTP3 streams
        timeout-minutes: 30
        run: |
          "$RUNNER_TEMP/http3-peers/bin/python" Tests/Clients/Stage2/HTTP3/verify.py \
            --binary "$SWIFTMITM_HTTP3_PROBE" --output evidence/http3-results.json
      - name: Retain transport spike evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-http3-transport-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  http3-production:
    name: Public HTTP3 acceptance (${{ matrix.partition }})
    needs: combined-graph
    runs-on: xcode-27
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        partition: [transport, resources, controls, lifecycle, security, ownership, memory, capacity]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-http3-production-host-${{ github.sha }}
          path: ${{ runner.temp }}/production-host
      - name: Validate the public consumer candidate and toolchain
        run: |
          mkdir -p evidence
          test "$(cat "$RUNNER_TEMP/production-host/candidate-sha.txt")" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/production-host/"{candidate-sha,swift,xcode}.txt evidence/
          xcodebuild -version > evidence/runtime-xcode.txt
          swift --version > evidence/runtime-swift.txt
          sw_vers > evidence/os.txt
          cmp evidence/runtime-xcode.txt evidence/xcode.txt
          cmp evidence/runtime-swift.txt evidence/swift.txt
          cp "$RUNNER_TEMP/production-host/Package.resolved" evidence/
          tar -xzf "$RUNNER_TEMP/production-host/HTTP3ProductionHost.tar.gz" -C "$RUNNER_TEMP/production-host"
          test -x "$RUNNER_TEMP/production-host/HTTP3ProductionHost"
      - name: Set up independent peer Python
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install isolated independent peers
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -m venv "$RUNNER_TEMP/http3-production-peers"
          "$RUNNER_TEMP/http3-production-peers/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r Tests/Clients/Stage2/HTTP3/requirements.txt
          "$RUNNER_TEMP/http3-production-peers/bin/python" -m pip freeze > evidence/peer-versions.txt
      - name: Exercise the public production library
        timeout-minutes: 25
        env:
          PARTITION: ${{ matrix.partition }}
        run: |
          if [[ "$PARTITION" == transport ]]; then
            cases=(streaming ip-san changed-authority upstream-hostname upstream-trust downstream-trust
              denied-route separated-fin oversized-request-headers oversized-response-headers
              fragmented-headers sni-policy goaway-drain octet-fidelity request-stream-limit)
          elif [[ "$PARTITION" == resources ]]; then
            cases=(slow-receiver cancelled-credit-churn storage-refusal maximum-storage-refusal upstream-credit-stall)
          elif [[ "$PARTITION" == controls ]]; then
            cases=(control-headers control-body control-synthetic control-breakpoint control-delay)
          elif [[ "$PARTITION" == lifecycle ]]; then
            cases=(lifecycle-restart pending-handshake-reset-churn connection-ceiling
              maximum-connection-ceiling maximum-handshake-ceiling handshake-deadline-1 handshake-deadline-30)
          elif [[ "$PARTITION" == security ]]; then
            cases=(cross-client-pooling mapped-route-isolation mapped-route-trust
              upstream-invalid-goaway upstream-increasing-goaway downstream-increasing-goaway
              downstream-goaway-drain unsupported-connect unsupported-webtransport validated-address-migration unsolicited-early-data)
          elif [[ "$PARTITION" == ownership ]]; then
            cases=(shared-byte-refusal orphan-stop-restart)
          elif [[ "$PARTITION" == capacity ]]; then
            cases=(shared-maximum-storage)
          else
            cases=(memory-cancel-cycles memory-maximum-storage memory-maximum-cycles)
          fi
          arguments=()
          for scenario in "${cases[@]}"; do arguments+=(--case "$scenario"); done
          "$RUNNER_TEMP/http3-production-peers/bin/python" Tests/Clients/Stage2/HTTP3/production_verify.py \
            --binary "$RUNNER_TEMP/production-host/HTTP3ProductionHost" \
            --output evidence/production-http3-results.json "${arguments[@]}"
      - name: Retain public production acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-http3-production-${{ matrix.partition }}-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  http3-native-allocations:
    name: Public HTTP3 native allocation diagnostic
    needs: combined-graph
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-http3-production-host-${{ github.sha }}
          path: ${{ runner.temp }}/production-host
      - name: Validate the public consumer candidate and toolchain
        run: |
          mkdir -p evidence
          test "$(cat "$RUNNER_TEMP/production-host/candidate-sha.txt")" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/production-host/"{candidate-sha,swift,xcode}.txt evidence/
          xcodebuild -version > evidence/runtime-xcode.txt
          swift --version > evidence/runtime-swift.txt
          sw_vers > evidence/os.txt
          cmp evidence/runtime-xcode.txt evidence/xcode.txt
          cmp evidence/runtime-swift.txt evidence/swift.txt
          cp "$RUNNER_TEMP/production-host/Package.resolved" evidence/
          tar -xzf "$RUNNER_TEMP/production-host/HTTP3ProductionHost.tar.gz" -C "$RUNNER_TEMP/production-host"
          test -x "$RUNNER_TEMP/production-host/HTTP3ProductionHost"
      - name: Set up independent peer Python
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install isolated independent peers
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -m venv "$RUNNER_TEMP/http3-production-peers"
          "$RUNNER_TEMP/http3-production-peers/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r Tests/Clients/Stage2/HTTP3/requirements.txt
          "$RUNNER_TEMP/http3-production-peers/bin/python" -m pip freeze > evidence/peer-versions.txt
      - name: Capture native allocation lifetimes
        timeout-minutes: 5
        run: |
          "$RUNNER_TEMP/http3-production-peers/bin/python" Tests/Clients/Stage2/HTTP3/production_allocations.py \
            --binary "$RUNNER_TEMP/production-host/HTTP3ProductionHost" \
            --malloc-history "$(xcrun --find malloc_history)" \
            --candidate "$GITHUB_SHA" \
            --output evidence/native-allocations.json
      - name: Retain native allocation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-http3-native-allocations-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  http3-rss-attribution:
    name: Public HTTP3 maximum-cycle RSS attribution
    needs: combined-graph
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-http3-production-host-${{ github.sha }}
          path: ${{ runner.temp }}/production-host
      - name: Validate the public consumer candidate and toolchain
        run: |
          mkdir -p evidence
          test "$(cat "$RUNNER_TEMP/production-host/candidate-sha.txt")" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/production-host/"{candidate-sha,swift,xcode}.txt evidence/
          xcodebuild -version > evidence/runtime-xcode.txt
          swift --version > evidence/runtime-swift.txt
          sw_vers > evidence/os.txt
          cmp evidence/runtime-xcode.txt evidence/xcode.txt
          cmp evidence/runtime-swift.txt evidence/swift.txt
          cp "$RUNNER_TEMP/production-host/Package.resolved" evidence/
          tar -xzf "$RUNNER_TEMP/production-host/HTTP3ProductionHost.tar.gz" -C "$RUNNER_TEMP/production-host"
          test -x "$RUNNER_TEMP/production-host/HTTP3ProductionHost"
      - name: Set up independent peer Python
        id: peer-python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.9'
          architecture: arm64
      - name: Install isolated independent peers
        env:
          PEER_PYTHON: ${{ steps.peer-python.outputs.python-path }}
        run: |
          "$PEER_PYTHON" -m venv "$RUNNER_TEMP/http3-production-peers"
          "$RUNNER_TEMP/http3-production-peers/bin/python" -m pip install --require-hashes --only-binary=:all: \
            -r Tests/Clients/Stage2/HTTP3/requirements.txt
          "$RUNNER_TEMP/http3-production-peers/bin/python" -m pip freeze > evidence/peer-versions.txt
      - name: Attribute maximum-cycle resident memory
        timeout-minutes: 8
        run: |
          "$RUNNER_TEMP/http3-production-peers/bin/python" Tests/Clients/Stage2/HTTP3/production_rss_attribution.py \
            --binary "$RUNNER_TEMP/production-host/HTTP3ProductionHost" \
            --malloc-history "$(xcrun --find malloc_history)" \
            --vmmap /usr/bin/vmmap \
            --candidate "$GITHUB_SHA" \
            --output evidence/maximum-rss-attribution.json
      - name: Retain maximum-cycle allocation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-http3-maximum-rss-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

  crypto5-minimum-runtime:
    name: Crypto5 core macOS26 smoke
    needs: core-consumer
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: stage2-crypto5-consumer-${{ github.sha }}
          path: ${{ runner.temp }}/consumer
      - name: Exercise the Xcode 27.1 binary on the deployment minimum
        run: |
          mkdir -p evidence
          sw_vers > evidence/os.txt
          grep -Eq '^ProductVersion:[[:space:]]+26\.' evidence/os.txt
          test "$(cat "$RUNNER_TEMP/consumer/candidate-sha.txt")" = "$GITHUB_SHA"
          cp "$RUNNER_TEMP/consumer/candidate-sha.txt" evidence/
          cp "$RUNNER_TEMP/consumer/swift.txt" evidence/build-swift.txt
          cp "$RUNNER_TEMP/consumer/xcode.txt" evidence/build-xcode.txt
          tar -xzf "$RUNNER_TEMP/consumer/FirstCapture.tar.gz" -C "$RUNNER_TEMP/consumer"
          export OPENSSL_BIN="$(brew --prefix openssl@3)/bin/openssl"
          "$OPENSSL_BIN" version > evidence/openssl.txt
          python3 - <<'PY'
          import http.server, json, os, pathlib, selectors, signal, subprocess, tempfile, threading, time
          body = b'SwiftMITM macOS 26 runtime smoke\n'
          class Origin(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header('Content-Length', str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *_):
                  pass
          evidence = pathlib.Path('evidence')
          binary = pathlib.Path(os.environ['RUNNER_TEMP']) / 'consumer/FirstCapture'
          origin = http.server.HTTPServer(('127.0.0.1', 0), Origin)
          origin_thread = threading.Thread(target=origin.serve_forever)
          origin_thread.start()
          process = None
          try:
              with tempfile.TemporaryDirectory() as temporary:
                  root = pathlib.Path(temporary)
                  key, certificate = root / 'ca-key.pem', root / 'ca.pem'
                  subprocess.run([os.environ['OPENSSL_BIN'], 'genpkey', '-algorithm', 'EC', '-pkeyopt',
                                  'ec_paramgen_curve:P-256', '-out', str(key)], check=True, timeout=20)
                  subprocess.run([os.environ['OPENSSL_BIN'], 'req', '-new', '-x509', '-key', str(key),
                                  '-out', str(certificate), '-days', '1', '-subj', '/CN=SwiftMITM CI',
                                  '-addext', 'basicConstraints=critical,CA:TRUE',
                                  '-addext', 'keyUsage=critical,keyCertSign,cRLSign'], check=True, timeout=20)
                  with (evidence / 'stderr.txt').open('wb') as errors:
                      process = subprocess.Popen([str(binary), '--ca-cert', str(certificate),
                          '--ca-key', str(key), '--port', '0', '--allow-internal'],
                          stdout=subprocess.PIPE, stderr=errors)
                      with selectors.DefaultSelector() as selector:
                          selector.register(process.stdout, selectors.EVENT_READ)
                          deadline = time.monotonic() + 20
                          first = bytearray()
                          while not first.endswith(b'\n'):
                              assert selector.select(timeout=max(0, deadline - time.monotonic())), 'Proxy did not announce startup'
                              chunk = os.read(process.stdout.fileno(), 4096)
                              assert chunk, 'Proxy exited before announcing startup'
                              first.extend(chunk)
                      listening = json.loads(first)
                      assert listening['type'] == 'listening'
                      response = subprocess.run(['/usr/bin/curl', '--silent', '--show-error', '--fail',
                          '--max-time', '20', '--noproxy', '', '--proxy',
                          f'http://127.0.0.1:{listening["port"]}',
                          f'http://127.0.0.1:{origin.server_port}/smoke'],
                          check=True, stdout=subprocess.PIPE, timeout=25)
                      assert response.stdout == body, 'Forwarded response differs from origin bytes'
                      process.send_signal(signal.SIGINT)
                      remaining, _ = process.communicate(timeout=20)
                      transcript = first + remaining
                      (evidence / 'events.jsonl').write_bytes(transcript)
                      assert process.returncode == 0, 'Proxy did not stop cleanly'
                      events = [json.loads(line)['type'] for line in transcript.splitlines()]
                      assert events.count('requestHead') == 1 and events.count('responseEnd') == 1
                      assert events[-1] == 'stopped'
                      assert not {'streamError', 'connectionFailure', 'deliveryLoss'} & set(events)
                  (evidence / 'scope.txt').write_text(
                      'Passed public startup, HTTP forwarding/capture and SIGINT stop only.\n'
                      'TLS, streaming clients and resource ceilings on macOS 26 remain unverified.\n')
          finally:
              if process is not None and process.poll() is None:
                  process.kill()
                  process.wait(timeout=10)
              origin.shutdown()
              origin.server_close()
              origin_thread.join(timeout=10)
          PY
      - name: Retain minimum-runtime smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage2-crypto5-minimum-runtime-${{ github.sha }}
          path: evidence/
          if-no-files-found: error

